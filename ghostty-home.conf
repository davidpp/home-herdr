# Overlay for a separate Ghostty instance; normal work config is untouched.
# The launcher supplies its command dynamically, so checkout paths are portable.
theme = Rose Pine
title = HOME — remote
macos-titlebar-style = transparent
window-theme = ghostty
quit-after-last-window-closed = true
# Preserve errors and startup output until a keypress, rather than disappearing.
wait-after-command = true

# Home-only Herdr shortcuts; the normal Ghostty window keeps native bindings.
keybind = super+t=text:\x00c
keybind = super+d=text:\x00v
keybind = super+shift+d=text:\x00-
# Closing the window must detach, not kill a remote pane or its agent.
keybind = super+w=close_surface
keybind = super+1=text:\x001
keybind = super+2=text:\x002
keybind = super+3=text:\x003
keybind = super+4=text:\x004
keybind = super+5=text:\x005
keybind = super+6=text:\x006
keybind = super+7=text:\x007
keybind = super+8=text:\x008
keybind = super+9=text:\x009
keybind = super+digit_1=text:\x001
keybind = super+digit_2=text:\x002
keybind = super+digit_3=text:\x003
keybind = super+digit_4=text:\x004
keybind = super+digit_5=text:\x005
keybind = super+digit_6=text:\x006
keybind = super+digit_7=text:\x007
keybind = super+digit_8=text:\x008
keybind = super+digit_9=text:\x009
